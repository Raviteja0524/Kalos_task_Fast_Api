services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"
    environment:
      # Local Postgres on the host — set in the root .env (see .env.example)
      DATABASE_URL: ${AUTH_DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      redis:
        condition: service_healthy

  product-service:
    build: ./product-service
    ports:
      - "8002:8002"
    environment:
      # Local Postgres on the host — set in the root .env (see .env.example)
      DATABASE_URL: ${PRODUCT_DATABASE_URL}
      REDIS_URL: redis://redis:6379/1
      # Same secret as auth-service — how product-service trusts its tokens
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      redis:
        condition: service_healthy
